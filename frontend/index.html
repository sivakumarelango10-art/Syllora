  <!-- Preload Critical Self-Hosted Fonts -->

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="workspace.css">

  <!-- Instant Direct-Workspace Navigation Guard (Zero Login Flash) -->
  <script>
    (function () {
      try {
        var hash = window.location.hash || '';
        var isAuth = false;
        try {
          var raw = localStorage.getItem('syllora_supabase_session');
          if (raw) {
            var parsed = JSON.parse(raw);
            isAuth = !!(parsed && (parsed.access_token || parsed.currentSession && parsed.currentSession.access_token));
          }
        } catch (e) {}
        if (hash.startsWith('#/app') && isAuth) {
          document.documentElement.classList.add('direct-workspace');
        }
      } catch (e) {}
    })();
  </script>
</head>

    <!-- ======================================================================
         RIGHT HALF: LOGIN CARD (460px wide, centered on off-white background)
         ====================================================================== -->
    <main class="login-panel" id="loginPanel">
      
      <div class="login-card" id="loginCard">
        
        <!-- Stagger Item 0: Heading + Subtext -->
        <div class="card-stagger-item item-header" data-stagger="0">
          <h1 class="card-title">Welcome back</h1>
          <p class="card-subtitle">Log in to continue learning</p>
        </div>

        <!-- Accessible Form -->
        <form id="authForm" class="auth-form" novalidate autocomplete="on">
          
          <!-- Stagger Item 1: Email Input -->
          <div class="card-stagger-item form-group" id="emailGroup" data-stagger="1">
            <label for="emailInput" class="form-label">Email</label>
            <div class="input-shell">
              <input id="emailInput"
                     name="email"
                     type="email"
                     class="form-input"
                     placeholder="you@example.com"
                     autocomplete="email"
                     spellcheck="false"
                     required>
            </div>
            <div class="field-error-msg" id="emailError" role="alert" aria-live="polite"></div>
          </div>

          <!-- Stagger Item 2: Password Input -->
          <div class="card-stagger-item form-group" id="passwordGroup" data-stagger="2">
            <label for="passwordInput" class="form-label">Password</label>
            <div class="input-shell">
              <input id="passwordInput"
                     name="password"
                     type="password"
                     class="form-input password-input"
                     placeholder="Enter your password"
                     autocomplete="current-password"
                     spellcheck="false"
                     required>
              <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Show password" tabindex="0">
                <!-- Eye Open Icon (22px) -->
                <svg class="eye-icon-show" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye Slash Icon (22px) -->
                <svg class="eye-icon-hide" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                  <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                  <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                  <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                  <line x1="2" y1="2" x2="22" y2="22"/>
                </svg>
              </button>
            </div>
            <div class="field-error-msg" id="passwordError" role="alert" aria-live="polite"></div>
          </div>

          <!-- Stagger Item 3: Remember Me & Forgot Password Row -->
          <div class="card-stagger-item remember-forgot-row" data-stagger="3">
            <label class="remember-checkbox-label" for="rememberMeCheckbox">
              <input type="checkbox" id="rememberMeCheckbox" name="remember" class="remember-checkbox">
              <span class="custom-checkbox-box" aria-hidden="true">
                <svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="2.5 7 5.5 10 11.5 3.5"/>
                </svg>
              </span>
              <span class="remember-text">Remember me</span>
            </label>
            <a href="#forgot" class="forgot-link">Forgot password?</a>
          </div>

          <!-- Stagger Item 4: Morphing Log In Button (Contained inside 396x56 box) -->
          <div class="card-stagger-item btn-morph-box" data-stagger="4">
            <button type="submit" class="login-btn" id="loginBtn" aria-busy="false">
              <!-- Default Label -->
              <span class="btn-label" id="btnLabel">Log in</span>

              <!-- 28px Spinner with 3px track and 90deg arc rotating at 420deg/s -->
              <div class="btn-spinner" id="btnSpinner" aria-hidden="true">
                <div class="spinner-arc"></div>
              </div>

              <!-- Success Checkmark (M-8 0.5 L-2.5 6 L8.5 -6) -->
              <svg class="btn-check-morph" id="btnCheckmarkMorph" viewBox="-15 -15 30 30" width="30" height="30" aria-hidden="true">
                <path id="morphCheckPath" d="M-8 0.5 L-2.5 6 L8.5 -6"
                      fill="none" stroke="#FFFFFF" stroke-width="3.4"
                      stroke-linecap="round" stroke-linejoin="round"
                      pathLength="1" stroke-dasharray="1.02" stroke-dashoffset="1.02"/>
              </svg>
            </button>
          </div>

          <!-- Stagger Item 5: Divider -->
          <div class="card-stagger-item divider-row" data-stagger="5">
            <span class="divider-text">or continue with</span>
          </div>

          <!-- Stagger Item 6: Google SSO Button -->
          <div class="card-stagger-item google-sso-wrap" data-stagger="6">
            <button type="button" class="google-btn" id="googleBtn">
              <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
              <span>Continue with Google</span>
            </button>
          </div>

          <!-- Stagger Item 7: Sign Up Prompt -->
          <div class="card-stagger-item signup-row" data-stagger="7">
            <p class="signup-text">
              Don't have an account? <a href="#signup" class="signup-link" id="signupLink">Sign up</a>
            </p>
          </div>

        </form>

      </div>

    </main>
