<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="100%" height="100%">
  <defs>
    <!-- Subtle depth gradient for the book pages -->
    <linearGradient id="leftPageGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04716E"/>
      <stop offset="100%" stop-color="#024A48"/>
    </linearGradient>
    <linearGradient id="rightPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03605E"/>
      <stop offset="100%" stop-color="#024A48"/>
    </linearGradient>
  </defs>

  <!-- Left Page (opens from spine at x=130) -->
  <path id="left-page" 
        d="M 126 38 C 104 38, 56 26, 42 28 C 36 29, 32 34, 32 40 L 32 124 C 32 130, 36 134, 42 135 C 60 137, 102 148, 126 150 Z" 
        fill="url(#leftPageGrad)"/>

  <!-- Right Page (opens from spine at x=130) -->
  <path id="right-page" 
        d="M 134 38 C 156 38, 204 26, 218 28 C 224 29, 228 34, 228 40 L 228 124 C 228 130, 224 134, 218 135 C 200 137, 158 148, 134 150 Z" 
        fill="url(#rightPageGrad)"/>

  <!-- Center White Checkmark / Sprout Stem -->
  <path id="logo-checkmark" 
        d="M 76 86 C 88 98, 114 126, 130 136 C 146 116, 172 72, 194 50" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
