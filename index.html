<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Syllora — Education &amp; Learning Platform</title>
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <link rel="icon" type="image/svg+xml" href="frontend/logo.svg">
  <script>
    window.location.replace("frontend/index.html");
  </script>
  <style>
    :root {
      --bg: #FAFAF8;
      --teal: #03605E;
      --ink: #22272B;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .loader {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(3, 96, 94, 0.2);
      border-top-color: var(--teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="loader" aria-hidden="true"></div>
  <p>Loading Syllora... <a href="frontend/index.html">Click here if not redirected automatically</a>.</p>
</body>

</html>
